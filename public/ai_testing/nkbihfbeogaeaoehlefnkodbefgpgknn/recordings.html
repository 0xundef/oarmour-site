<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Operation Recordings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">
    <div class="max-w-6xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Agent Operation Recordings</h1>
            <p class="mt-4 text-lg text-gray-500">Step-by-step procedure of MetaMask wallet import</p>
        </header>

        <div class="space-y-12 relative" id="recordings-container">
            <!-- Timeline vertical line -->
            <div class="hidden md:block absolute z-0 w-1 bg-blue-200 h-full left-1/2 transform -translate-x-1/2 top-0"></div>
            <!-- RECORDINGS_CONTENT -->
        </div>
    </div>

    <script>
        // The JSON data will be injected here by the build script
        const recordingsData = [
  {
    "time": "08:15:54",
    "thinking": "Great! The browser has opened successfully. Now let me check the available Playwright CLI commands to work with extensions and take screenshots. Perfect! I can see the MetaMask extension is available in tab 1. Let me select it and take a screenshot.",
    "image": "snap/page-2026-04-29T08-15-54-748Z.png"
  },
  {
    "time": "08:15:57",
    "thinking": "Great! I can see the MetaMask login screen. I see the MetaMask login page is asking for a password, not a mnemonic phrase. This suggests that MetaMask has already been set up with a password-protected account.",
    "image": "snap/page-2026-04-29T08-15-57-467Z.png"
  },
  {
    "time": "08:16:13",
    "thinking": "Since I need to log in with a mnemonic phrase, I should first click 'Forgot password?' to reset the password or use the import account feature.",
    "image": "snap/page-2026-04-29T08-16-13-205Z.png"
  },
  {
    "time": "08:16:22",
    "thinking": "Perfect! Now I can see the 'Forgot Password' dialog. It says 'Please enter the corresponding seed phrase to re-add your wallet to MetaMask' and there's an 'Import wallet' button. Let me click on that.",
    "image": "snap/page-2026-04-29T08-16-22-706Z.png"
  },
  {
    "time": "08:16:29",
    "thinking": "Perfect! Now I can see the wallet import screen with a textarea for entering the mnemonic phrase. Let me fill in the generated mnemonic phrase.",
    "image": "snap/page-2026-04-29T08-16-29-003Z.png"
  },
  {
    "time": "08:17:02",
    "thinking": "Interesting! The interface has changed and now shows the phrase split across multiple input boxes. Let me click 'Clear all' to start fresh and try a different approach.",
    "image": "snap/page-2026-04-29T08-17-02-380Z.png"
  },
  {
    "time": "08:17:30",
    "thinking": "Excellent! Now the mnemonic phrase has been properly entered and distributed across the individual word boxes. The 'Continue' button is now enabled. Let me take a screenshot and then click continue.",
    "image": "snap/page-2026-04-29T08-17-30-871Z.png"
  },
  {
    "time": "08:18:15",
    "thinking": "Great! The mnemonic phrase was accepted and now I'm on the 'Create Password' screen. I need to create a new password for the wallet. Let me fill in the password fields.",
    "image": "snap/page-2026-04-29T08-18-15-473Z.png"
  },
  {
    "time": "08:18:39",
    "thinking": "Excellent! Now the checkbox is checked and the 'Create Password' button is now enabled. Let me try clicking the 'Create Password' button.",
    "image": "snap/page-2026-04-29T08-18-39-100Z.png"
  },
  {
    "time": "08:18:56",
    "thinking": "Perfect! The wallet import process completed successfully! I can now see the main MetaMask interface showing Account 1. Let me take one final screenshot to capture this successful login state.",
    "image": "snap/page-2026-04-29T08-18-56-674Z.png"
  }
];

        const container = document.getElementById('recordings-container');
        let html = '';

        recordingsData.forEach((step, index) => {
            html += `
            <div class="relative z-10 flex flex-col md:flex-row items-center justify-between w-full mb-12">
                
                <!-- Left Content (Thinking) -->
                <div class="w-full md:w-5/12 md:pr-8 mb-6 md:mb-0">
                    <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-6 card-hover transition-all duration-300">
                        <div class="flex items-center space-x-3 mb-4">
                            <span class="text-sm font-bold text-gray-400 bg-gray-100 px-3 py-1 rounded-full">${step.time}</span>
                            <h3 class="text-xl font-bold text-blue-900">Step ${index + 1}</h3>
                        </div>
                        <div class="bg-blue-50/50 rounded-xl p-5 border border-blue-100/50 text-left">
                            <h4 class="text-xs font-bold text-blue-800 uppercase tracking-wider mb-2 flex items-center">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                Agent Thinking
                            </h4>
                            <p class="text-sm text-gray-700 leading-relaxed font-medium">
                                ${step.thinking}
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Center Node -->
                <div class="hidden md:flex w-2/12 justify-center items-center">
                    <div class="w-10 h-10 rounded-full bg-blue-600 border-4 border-white shadow flex items-center justify-center text-white font-bold z-20">
                        ${index + 1}
                    </div>
                </div>

                <!-- Right Content (Image) -->
                <div class="w-full md:w-5/12 md:pl-8">
                    <div class="bg-white rounded-xl overflow-hidden shadow-lg border border-gray-200 card-hover transition-all duration-300 group">
                        <div class="px-4 py-2 bg-gray-100 border-b border-gray-200 flex items-center space-x-2">
                            <div class="w-3 h-3 rounded-full bg-red-400"></div>
                            <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                            <div class="w-3 h-3 rounded-full bg-green-400"></div>
                            <span class="ml-2 text-xs text-gray-500 font-mono truncate">Operation Snapshot</span>
                        </div>
                        <div class="relative overflow-hidden bg-gray-50">
                            <img src="${step.image}" alt="Step ${index + 1} Snapshot" class="w-full h-auto object-cover transform group-hover:scale-105 transition-transform duration-500">
                        </div>
                    </div>
                </div>

            </div>
            `;
        });

        container.innerHTML += html;
    </script>
</body>
</html>
