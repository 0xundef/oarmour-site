name: CI & Deploy (realtime)

# NOTE: This workflow lives on the `realtime` branch and only governs pushes to
# `realtime`. The `main` branch keeps its own ci.yml and is unaffected.
# Realtime deploys as a SEPARATE instance on the self-hosted runner (claw1):
# its own deploy dir, port, pm2 process name, NEXTAUTH_URL, and DB schema
# (?schema=realtime). Configure the repo vars/secrets listed below.

on:
  push:
    branches: [ realtime ]
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git ref to deploy (commit SHA, branch, or tag). Default: realtime.'
        required: false
        default: 'realtime'

concurrency:
  group: ci-deploy-realtime
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `prisma generate` (run by `npm run build`) can resolve the
      # datasource env at build time. Not used; no DB connection happens at build.
      REALTIME_DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=realtime
      REALTIME_DIRECT_URL: postgresql://user:password@localhost:5432/db?schema=realtime
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test || echo "No tests specified"

  deploy:
    # Skipped (not failed) until REALTIME_DEPLOY_PATH is configured in repo vars.
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.REALTIME_DEPLOY_PATH != '' }}
    runs-on: self-hosted
    env:
      DEPLOY_PATH: ${{ vars.REALTIME_DEPLOY_PATH }}
      APP_PORT: ${{ vars.REALTIME_APP_PORT }}
      TARGET_REF: ${{ github.event.inputs.target_ref || 'realtime' }}
      REALTIME_DATABASE_URL: ${{ secrets.REALTIME_DATABASE_URL }}
      REALTIME_DIRECT_URL: ${{ secrets.REALTIME_DIRECT_URL }}
      NEXTAUTH_URL: ${{ vars.REALTIME_NEXTAUTH_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_USE_ADAPTER: ${{ vars.NEXTAUTH_USE_ADAPTER }}
      NEXTAUTH_DEV_ADMIN_EMAILS: ${{ vars.NEXTAUTH_DEV_ADMIN_EMAILS }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      OAUTH_GITHUB_ID: ${{ vars.OAUTH_GITHUB_ID }}
      OAUTH_GITHUB_SECRET: ${{ secrets.OAUTH_GITHUB_SECRET }}
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      SMTP_SERVER: ${{ vars.SMTP_SERVER }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE }}
      SMTP_USER: ${{ vars.SMTP_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
    steps:
      - name: Deploy realtime on server
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "Missing vars.REALTIME_DEPLOY_PATH" >&2
            exit 1
          fi
          cd "$DEPLOY_PATH"
          git fetch origin --prune --tags "${TARGET_REF}"
          if git cat-file -t "origin/${TARGET_REF}" 2>/dev/null | grep -q 'commit'; then
            git checkout -f "${TARGET_REF}"
            git reset --hard "origin/${TARGET_REF}"
          else
            git checkout -f "${TARGET_REF}"
          fi

          mkdir -p .logs
          npm install --no-audit --no-fund
          if ! npx prisma migrate deploy 2> >(tee .logs/prisma-migrate-deploy.err >&2); then
            if grep -q "P3005" .logs/prisma-migrate-deploy.err; then
              for m in prisma/migrations/*; do
                if [ -d "$m" ]; then
                  name="$(basename "$m")"
                  npx prisma migrate resolve --applied "$name"
                fi
              done
              npx prisma migrate deploy
            else
              exit 1
            fi
          fi
          npm run build

          if command -v pm2 >/dev/null 2>&1; then
            SUDO_PRESERVE_ENV="--preserve-env=DEPLOY_PATH,APP_PORT,PORT,REALTIME_DATABASE_URL,REALTIME_DIRECT_URL,NEXTAUTH_URL,NEXTAUTH_SECRET,NEXTAUTH_USE_ADAPTER,NEXTAUTH_DEV_ADMIN_EMAILS,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,OAUTH_GITHUB_ID,OAUTH_GITHUB_SECRET,STRIPE_API_KEY,STRIPE_WEBHOOK_SECRET,NEXT_PUBLIC_POSTHOG_KEY,NEXT_PUBLIC_POSTHOG_HOST,SMTP_SERVER,SMTP_PORT,SMTP_SECURE,SMTP_USER,EMAIL_PASSWORD,EMAIL_FROM"
            sudo "$SUDO_PRESERVE_ENV" pm2 delete realtime >/dev/null 2>&1 || true
            if [ -n "${APP_PORT:-}" ]; then
              PORT="$APP_PORT" sudo "$SUDO_PRESERVE_ENV" pm2 start npm --name realtime -- run start -- -p "$APP_PORT"
            else
              sudo "$SUDO_PRESERVE_ENV" pm2 start npm --name realtime -- run start
            fi
            sudo "$SUDO_PRESERVE_ENV" pm2 save
          else
            pkill -f "next start" >/dev/null 2>&1 || true
            if [ -n "${APP_PORT:-}" ]; then
              PORT="$APP_PORT" nohup npm run start -- -p "$APP_PORT" > .logs/start.log 2>&1 &
            else
              nohup npm run start > .logs/start.log 2>&1 &
            fi
          fi
