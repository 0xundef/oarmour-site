name: CI & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test || echo "No tests specified"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Deploy on server
        shell: bash
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "Missing vars.DEPLOY_PATH" >&2
            exit 1
          fi
          cd "$DEPLOY_PATH"
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main

          mkdir -p .logs
          npm install --no-audit --no-fund
          npx prisma migrate deploy
          npm run build

          if command -v pm2 >/dev/null 2>&1; then
            pm2 delete oarmour-site >/dev/null 2>&1 || true
            if [ -n "${APP_PORT:-}" ]; then
              PORT="$APP_PORT" pm2 start npm --name oarmour-site -- run start -- -p "$APP_PORT"
            else
              pm2 start npm --name oarmour-site -- run start
            fi
            pm2 save
          else
            pkill -f "next start" >/dev/null 2>&1 || true
            if [ -n "${APP_PORT:-}" ]; then
              PORT="$APP_PORT" nohup npm run start -- -p "$APP_PORT" > .logs/start.log 2>&1 &
            else
              nohup npm run start > .logs/start.log 2>&1 &
            fi
          fi