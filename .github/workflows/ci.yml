name: CI & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git ref to deploy (commit SHA, branch, or tag). Leave empty to use main.'
        required: false
        default: ''

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test || echo "No tests specified"

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Deploy on server
        shell: bash
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          APP_PORT: ${{ vars.APP_PORT }}
          TARGET_REF: ${{ github.event.inputs.target_ref || 'main' }}
          db1_POSTGRES_PRISMA_URL: ${{ secrets.DB1_POSTGRES_PRISMA_URL }}
          db1_POSTGRES_URL_NON_POOLING: ${{ secrets.DB1_POSTGRES_URL_NON_POOLING }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_USE_ADAPTER: ${{ vars.NEXTAUTH_USE_ADAPTER }}
          NEXTAUTH_DEV_ADMIN_EMAILS: ${{ vars.NEXTAUTH_DEV_ADMIN_EMAILS }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OAUTH_GITHUB_ID: ${{ vars.OAUTH_GITHUB_ID }}
          OAUTH_GITHUB_SECRET: ${{ secrets.OAUTH_GITHUB_SECRET }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          UPLOADTHING_SECRET: ${{ secrets.UPLOADTHING_SECRET }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "Missing vars.DEPLOY_PATH" >&2
            exit 1
          fi
          cd "$DEPLOY_PATH"
          git fetch origin --prune --tags "${TARGET_REF}"
          if git cat-file -t "origin/${TARGET_REF}" 2>/dev/null | grep -q 'commit'; then
            git checkout -f "${TARGET_REF}"
            git reset --hard "origin/${TARGET_REF}"
          else
            git checkout -f "${TARGET_REF}"
          fi

          mkdir -p .logs
          npm install --no-audit --no-fund
          if ! npx prisma migrate deploy 2> >(tee .logs/prisma-migrate-deploy.err >&2); then
            if grep -q "P3005" .logs/prisma-migrate-deploy.err; then
              for m in prisma/migrations/*; do
                if [ -d "$m" ]; then
                  name="$(basename "$m")"
                  npx prisma migrate resolve --applied "$name"
                fi
              done
              npx prisma migrate deploy
            else
              exit 1
            fi
          fi
          npm run build

          if command -v pm2 >/dev/null 2>&1; then
            SUDO_PRESERVE_ENV="--preserve-env=DEPLOY_PATH,APP_PORT,PORT,db1_POSTGRES_PRISMA_URL,db1_POSTGRES_URL_NON_POOLING,NEXTAUTH_URL,NEXTAUTH_SECRET,NEXTAUTH_USE_ADAPTER,NEXTAUTH_DEV_ADMIN_EMAILS,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,OAUTH_GITHUB_ID,OAUTH_GITHUB_SECRET,STRIPE_API_KEY,STRIPE_WEBHOOK_SECRET,NEXT_PUBLIC_POSTHOG_KEY,NEXT_PUBLIC_POSTHOG_HOST,VIRUSTOTAL_API_KEY,UPLOADTHING_SECRET,UPLOADTHING_APP_ID"
            sudo "$SUDO_PRESERVE_ENV" pm2 delete oarmour-site >/dev/null 2>&1 || true
            if [ -n "${APP_PORT:-}" ]; then
              PORT="$APP_PORT" sudo "$SUDO_PRESERVE_ENV" pm2 start npm --name oarmour-site -- run start -- -p "$APP_PORT"
            else
              sudo "$SUDO_PRESERVE_ENV" pm2 start npm --name oarmour-site -- run start
            fi
            sudo "$SUDO_PRESERVE_ENV" pm2 save
          else
            pkill -f "next start" >/dev/null 2>&1 || true
            if [ -n "${APP_PORT:-}" ]; then
              PORT="$APP_PORT" nohup npm run start -- -p "$APP_PORT" > .logs/start.log 2>&1 &
            else
              nohup npm run start > .logs/start.log 2>&1 &
            fi
          fi
